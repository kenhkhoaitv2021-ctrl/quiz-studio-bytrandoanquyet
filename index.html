            },

            toggleConfigModeUI() {
                const mode = document.querySelector('input[name="sessionMode"]:checked')?.value || 'teacher_present';
                const teacherCfg = document.getElementById('teacherOnlyConfig');
                const studentCfg = document.getElementById('studentOnlyConfig');
                if (mode === 'teacher_present') {
                    teacherCfg?.classList.remove('hidden');
                    studentCfg?.classList.add('hidden');
                } else {
                    teacherCfg?.classList.add('hidden');
                    studentCfg?.classList.remove('hidden');
                }
            },

            startConfiguredSession() {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;

                if (quiz.status !== 'APPROVED' && quiz.status !== 'IN_USE' && quiz.status !== 'COMPLETED') {
                    this.toast('Bộ câu hỏi chưa được xác nhận!', 'error');
                    return this.navigate('review', quiz.id);
                }

                const mode = document.querySelector('input[name="sessionMode"]:checked')?.value || 'teacher_present';
                const missingAnsCount = quiz.questions.filter(q => !q.correctAnswer).length;

                if (mode === 'student_practice' && missingAnsCount > 0) {
                    this.toast(`Không thể bắt đầu chế độ Tự làm bài chấm điểm vì còn ${missingAnsCount} câu hỏi chưa có đáp án đúng!`, 'error');
                    return;
                }

                const defaultTimer = parseInt(document.getElementById('cfgDefaultTimer')?.value, 10) || 20;
                const shuffle = document.getElementById('cfgShuffleQuestions')?.value === 'true';
                const autoAdvance = Boolean(document.getElementById('cfgAutoAdvanceOnTimeout')?.checked);
                const allowExplanation = document.getElementById('cfgAllowReviewExplanation') ? Boolean(document.getElementById('cfgAllowReviewExplanation').checked) : true;

                let sessionQuestions = JSON.parse(JSON.stringify(quiz.questions));
                if (shuffle) {
                    sessionQuestions.sort(() => Math.random() - 0.5);
                }

                // Khởi tạo đối tượng QuizSession độc lập, đảm bảo mọi câu hỏi đều ẩn đáp án ban đầu
                this.state.activeSession = {
                    id: 'sess_' + Date.now(),
                    quizSetId: quiz.id,
                    quizTitle: quiz.title,
                    lessonId: quiz.lessonId,
                    mode, // 'teacher_present' | 'student_practice'
                    config: {
                        defaultTimer,
                        shuffle,
                        autoAdvance,
                        allowExplanation
                    },
                    questions: sessionQuestions,
                    currentIndex: 0,
                    // Trạng thái riêng cho từng câu hỏi (tách biệt hoàn toàn để chuyển câu không bị lẫn trạng thái hiện đáp án)
                    questionStates: sessionQuestions.reduce((acc, q) => {
                        acc[q.id] = {
                            answerRevealed: false,
                            explanationVisible: true,
                            selectedOption: null, // Dùng cho học sinh tự luyện hoặc giáo viên ghi nhận lựa chọn trên lớp
                            flaggedForReview: false
                        };
                        return acc;
                    }, {}),
                    startedAt: new Date().toISOString(),
                    finishedAt: null,
                    submitted: false
                };

                quiz.status = 'IN_USE';
                this.saveToStorage();

                // Thiết lập đồng hồ về thời lượng đã chọn nhưng CHƯA CHẠY (Quy tắc X.1 & X.2)
                this.resetTimerToDuration(defaultTimer);
                this.navigate('session', quiz.id);
            },

            stopTimerInterval() {
                if (this.state.timer.intervalId) {
                    clearInterval(this.state.timer.intervalId);
                    this.state.timer.intervalId = null;
                }
            },

            selectTimerDuration(seconds) {
                const sec = Math.max(1, parseInt(seconds, 10) || 20);
                // Quy tắc 1: Chọn thời lượng KHÔNG làm đồng hồ chạy
                this.stopTimerInterval();
                this.state.timer.selectedDuration = sec;
                this.state.timer.remainingSeconds = sec;
                this.state.timer.status = 'IDLE';
                this.updateTimerDisplayUI();
            },

            startTimer() {
                // Quy tắc 2 & 9: Chỉ bắt đầu khi nhấn Start, không tạo nhiều bộ đếm đồng thời
                this.stopTimerInterval();
                if (this.state.timer.remainingSeconds <= 0) {
                    this.state.timer.remainingSeconds = this.state.timer.selectedDuration;
                }
                this.state.timer.status = 'RUNNING';
                this.updateTimerDisplayUI();

                this.state.timer.intervalId = setInterval(() => {
                    if (this.state.timer.remainingSeconds > 0) {
                        this.state.timer.remainingSeconds -= 1;
                        this.updateTimerDisplayUI();
                    }
                    if (this.state.timer.remainingSeconds <= 0) {
                        this.handleTimerExpired();
                    }
                }, 1000);
            },

            pauseTimer() {
                // Quy tắc 3: Tạm dừng giữ nguyên thời gian còn lại
                if (this.state.timer.status !== 'RUNNING') return;
                this.stopTimerInterval();
                this.state.timer.status = 'PAUSED';
                this.updateTimerDisplayUI();
            },

            resumeTimer() {
                // Quy tắc 4: Tiếp tục chạy từ thời gian đang giữ
                if (this.state.timer.status !== 'PAUSED' || this.state.timer.remainingSeconds <= 0) return;
                this.startTimer();
            },

            resetTimerToDuration(durationOverride = null) {
                // Quy tắc 5: Đặt lại phải trở về thời lượng đã chọn và ở trạng thái chờ
                this.stopTimerInterval();
                if (durationOverride !== null) {
                    this.state.timer.selectedDuration = durationOverride;
                }
                this.state.timer.remainingSeconds = this.state.timer.selectedDuration;
                this.state.timer.status = 'IDLE';
                this.updateTimerDisplayUI();
            },

            stopTimerCompletely() {
                this.stopTimerInterval();
                this.state.timer.status = 'IDLE';
                this.updateTimerDisplayUI();
            },

            handleTimerExpired() {
                // Quy tắc 6 & 7: Hết giờ KHÔNG tự động hiện đáp án, KHÔNG tự động chuyển câu trừ khi bật autoAdvance
                this.stopTimerInterval();
                this.state.timer.remainingSeconds = 0;
                this.state.timer.status = 'EXPIRED';
                this.updateTimerDisplayUI();
                this.toast('Đã hết thời gian trả lời cho câu hỏi này!', 'warning');

                const sess = this.state.activeSession;
                if (sess && sess.config.autoAdvance && sess.currentIndex < sess.questions.length - 1) {
                    setTimeout(() => {
                        if (this.state.currentView === 'session' && this.state.timer.status === 'EXPIRED') {
                            this.goToSessionQuestion(sess.currentIndex + 1);
                        }
                    }, 1200);
                }
            },

            updateTimerDisplayUI() {
                const numEl = document.getElementById('timerSecondsDisplay');
                const badgeEl = document.getElementById('timerStateBadge');
                const barEl = document.getElementById('timerProgressBar');
                const controlWrap = document.getElementById('timerControlsContainer');
                if (!numEl) return;

                const rem = this.state.timer.remainingSeconds;
                const total = this.state.timer.selectedDuration || 20;
                const pct = Math.max(0, Math.min(100, Math.round((rem / total) * 100)));
                const st = this.state.timer.status;

                numEl.textContent = `${String(rem).padStart(2, '0')}s`;

                if (rem <= 5 && rem > 0 && st === 'RUNNING') {
                    numEl.className = 'text-3xl font-extrabold font-mono text-rose-600 timer-warning';
                } else if (rem === 0 || st === 'EXPIRED') {
                    numEl.className = 'text-3xl font-extrabold font-mono text-rose-600';
                } else {
                    numEl.className = 'text-3xl font-extrabold font-mono text-slate-900';
                }

                if (badgeEl) {
                    const labels = {
                        IDLE: { text: 'Chờ bấm giờ', cls: 'bg-slate-200 text-slate-700' },
                        RUNNING: { text: 'Đang đếm ngược', cls: 'bg-emerald-100 text-emerald-800' },
                        PAUSED: { text: 'Đang tạm dừng', cls: 'bg-amber-100 text-amber-800' },
                        EXPIRED: { text: 'Hết giờ!', cls: 'bg-rose-600 text-white' }
                    };
                    const cur = labels[st] || labels.IDLE;
                    badgeEl.className = `px-2 py-0.5 rounded text-[11px] font-bold ${cur.cls}`;
                    badgeEl.textContent = cur.text;
                }

                if (barEl) {
                    barEl.style.width = `${pct}%`;
                    barEl.className = `h-1.5 rounded-full transition-all duration-300 ${rem <= 5 ? 'bg-rose-500' : 'bg-blue-600'}`;
                }

                if (controlWrap) {
                    controlWrap.innerHTML = this.renderTimerActionButtonsHTML();
                }
            },

            renderTimerActionButtonsHTML() {
                const st = this.state.timer.status;
                const sel = this.state.timer.selectedDuration;

                return `
                    <!-- Preset Durations (10s, 20s, 30s, Custom) -->
                    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        ${[10, 20, 30].map(sec => `
                            <button onclick="app.selectTimerDuration(${sec})"
                                class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${sel === sec ? 'bg-slate-900 text-white shadow-2xs' : 'text-slate-600 hover:bg-slate-200'}">
                                ${sec}s
                            </button>
                        `).join('')}
                        <input type="number" min="5" max="300" placeholder="Khác"
                            onchange="app.selectTimerDuration(this.value)"
                            class="w-14 px-2 py-1 text-xs font-semibold bg-white border border-slate-300 rounded-lg text-center"
                            title="Nhập số giây tùy chỉnh">
                    </div>

                    <!-- Start / Pause / Resume / Reset / Stop -->
                    <div class="flex items-center gap-1.5">
                        ${st === 'IDLE' || st === 'EXPIRED' ? `
                            <button onclick="app.startTimer()" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-2xs">
                                <i class="fa-solid fa-play"></i> Start / Bắt đầu
                            </button>
                        ` : ''}
                        ${st === 'RUNNING' ? `
                            <button onclick="app.pauseTimer()" class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-2xs">
                                <i class="fa-solid fa-pause"></i> Tạm dừng
                            </button>
                        ` : ''}
                        ${st === 'PAUSED' ? `
                            <button onclick="app.resumeTimer()" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-2xs">
                                <i class="fa-solid fa-play"></i> Tiếp tục
                            </button>
                        ` : ''}
                        <button onclick="app.resetTimerToDuration()" class="px-3 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold flex items-center gap-1" title="Đặt lại về thời lượng đã chọn">
                            <i class="fa-solid fa-rotate-left"></i> Đặt lại
                        </button>
                        <button onclick="app.stopTimerCompletely()" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold flex items-center gap-1" title="Dừng thời gian">
                            <i class="fa-solid fa-stop"></i> Dừng
                        </button>
                    </div>
                `;
            },

            renderSessionView(ws) {
                const sess = this.state.activeSession;
                if (!sess) return this.navigate('dashboard');

                const q = sess.questions[sess.currentIndex];
                const qState = sess.questionStates[q.id];
                const total = sess.questions.length;
                const isTeacher = sess.mode === 'teacher_present';

                ws.innerHTML = `
                    <div class="max-w-5xl mx-auto space-y-4 pb-10">
                        <!-- Top Timeline & Countdown Control Bar -->
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-4 space-y-3">

                                <!-- Timer Readout -->

                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span id="timerSecondsDisplay" class="text-3xl font-extrabold font-mono text-slate-900">
                                                ${String(this.state.timer.remainingSeconds).padStart(2, '0')}s
                                            </span>
                                            <span id="timerStateBadge" class="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-200 text-slate-700">

                                            </span>

                                        <p class="text-[11px] text-slate-500">
                                            ${isTeacher ? 'Chế độ Giáo viên trình chiếu & điều khiển lớp' : 'Chế độ Học sinh tự làm bài cá nhân'}
                                        </p>
                                    </div>
                                </div>

                                <!-- Timer Controls -->
                                <div id="timerControlsContainer" class="flex flex-wrap items-center gap-2">
                                    ${this.renderTimerActionButtonsHTML()}
                                </div>
                            </div>

                            <!-- Visual Progress Bar for Timer -->
                            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div id="timerProgressBar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style="width: 100%"></div>
                            </div>
                        </div>

                        <!-- Question Navigation Pills -->
                        <div class="bg-white rounded-2xl border border-slate-200 px-4 py-3 flex items-center justify-between gap-4 overflow-x-auto">
                            <div class="flex items-center gap-1.5">
                                ${sess.questions.map((item, idx) => {
                                    const st = sess.questionStates[item.id];
                                    const isCurrent = idx === sess.currentIndex;
                                    const hasSelected = Boolean(st.selectedOption);
                                    const isRevealed = Boolean(st.answerRevealed);
                                    let btnCls = 'bg-slate-100 text-slate-700 hover:bg-slate-200';
                                    if (isCurrent) btnCls = 'bg-blue-600 text-white ring-2 ring-blue-300';
                                    else if (isRevealed) btnCls = 'bg-emerald-100 text-emerald-800 border border-emerald-300';
                                    else if (hasSelected) btnCls = 'bg-blue-50 text-blue-800 border border-blue-300';
                                    return `
                                        <button onclick="app.goToSessionQuestion(${idx})"
                                            class="w-9 h-9 rounded-xl text-xs font-extrabold shrink-0 transition ${btnCls}">
                                            ${idx + 1}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="text-xs font-bold text-slate-600 shrink-0">
                                Câu ${sess.currentIndex + 1} / ${total}
                            </div>
                        </div>

                        <!-- Main Question Presentation Stage -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 md:p-8 space-y-6">
                            <!-- Question Meta Header -->
                            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-4">
                                <div class="flex items-center gap-2">
                                    <span class="px-3 py-1 rounded-xl bg-blue-600 text-white text-xs font-extrabold">
                                        CÂU HỎI ${sess.currentIndex + 1}
                                    </span>
                                    <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">
                                        Mức độ: ${this.escapeHTML(q.cognitiveLevel)}
                                    </span>
                                    ${q.topic ? `
                                        <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs">
                                            ${this.escapeHTML(q.topic)}
                                        </span>
                                    ` : ''}
                                </div>

                                ${!isTeacher ? `
                                    <button onclick="app.toggleStudentFlagQuestion('${q.id}')"
                                        class="px-3 py-1 rounded-lg border text-xs font-semibold ${qState.flaggedForReview ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-white border-slate-200 text-slate-600'}">
                                        <i class="fa-solid fa-bookmark mr-1"></i> ${qState.flaggedForReview ? 'Đã đánh dấu xem lại' : 'Đánh dấu xem lại'}
                                    </button>
                                ` : `
                                    <span class="text-xs text-slate-400">
                                        <i class="fa-regular fa-keyboard mr-1"></i> Phím tắt: Mũi tên Trái/Phải để chuyển câu
                                    </span>
                                `}
                            </div>

                            <!-- Question Prompt (Large & Clear for Classroom Projection) -->
                            <div class="${isTeacher ? 'presentation-text' : 'text-lg md:text-xl'} font-bold text-slate-900 leading-relaxed">
                                ${this.escapeHTML(q.content)}
                            </div>

                            <!-- Answer Options Grid -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                ${q.options.map(opt => {
                                    const isSelected = qState.selectedOption === opt.key;
                                    const isCorrect = q.correctAnswer === opt.key;
                                    const showAnswerNow = qState.answerRevealed;

                                    let cardStyle = 'bg-slate-50 hover:bg-blue-50/50 border-slate-200 text-slate-800';
                                    let badgeStyle = 'bg-white border border-slate-300 text-slate-800';

                                    if (showAnswerNow) {
                                        if (isCorrect) {
                                            cardStyle = 'bg-emerald-50 border-emerald-500 ring-2 ring-emerald-200 text-emerald-950';
                                            badgeStyle = 'bg-emerald-600 text-white';
                                        } else if (isSelected && !isCorrect) {
                                            cardStyle = 'bg-rose-50 border-rose-400 text-rose-950';
                                            badgeStyle = 'bg-rose-600 text-white';
                                        } else {
                                            cardStyle = 'bg-slate-50/60 border-slate-200 text-slate-500 opacity-75';
                                        }
                                    } else if (isSelected) {
                                        cardStyle = 'bg-blue-50 border-blue-600 ring-2 ring-blue-200 text-blue-950';
                                        badgeStyle = 'bg-blue-600 text-white';
                                    }

                                    return `
                                        <button type="button" onclick="app.selectOptionInSession('${q.id}', '${opt.key}')"
                                            class="text-left p-4 md:p-5 rounded-2xl border-2 transition flex items-start gap-3.5 ${cardStyle}">
                                            <span class="w-10 h-10 rounded-xl font-extrabold text-sm flex items-center justify-center shrink-0 shadow-2xs ${badgeStyle}">
                                                ${opt.key}
                                            </span>
                                            <div class="flex-1 ${isTeacher ? 'presentation-option' : 'text-sm md:text-base'} font-semibold pt-1">
                                                ${this.escapeHTML(opt.text)}
                                            </div>
                                            ${showAnswerNow && isCorrect ? `
                                                <i class="fa-solid fa-circle-check text-emerald-600 text-xl mt-1.5"></i>
                                            ` : ''}
                                            ${showAnswerNow && isSelected && !isCorrect ? `
                                                <i class="fa-solid fa-circle-xmark text-rose-600 text-xl mt-1.5"></i>
                                            ` : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            <!-- Answer & Explanation Section (Strictly hidden until "Hiện đáp án" is clicked) -->
                            ${qState.answerRevealed ? `
                                <div class="mt-6 rounded-2xl bg-emerald-50/90 border border-emerald-300 p-5 space-y-2 transition">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-2 text-emerald-950 font-extrabold text-sm">
                                            <i class="fa-solid fa-lightbulb text-emerald-600"></i>
                                            <span>ĐÁP ÁN ĐÚNG: PHƯƠNG ÁN ${this.escapeHTML(q.correctAnswer || 'Chưa xác định')}</span>
                                        </div>
                                        <button onclick="app.toggleExplanationVisibility('${q.id}')" class="text-xs font-bold text-emerald-800 hover:underline">
                                            ${qState.explanationVisible ? 'Ẩn lời giải' : 'Hiện lời giải'}
                                        </button>
                                    </div>
                                    ${qState.explanationVisible ? `
                                        <div class="text-xs md:text-sm text-emerald-900 leading-relaxed pt-1 border-t border-emerald-200/80">
                                            <p><strong>Lời giải chi tiết:</strong> ${this.escapeHTML(q.explanation || 'Chưa có lời giải chi tiết cho câu hỏi này.')}</p>
                                            ${q.referenceNote ? `<p class="text-xs text-emerald-700 mt-1"><strong>Căn cứ tham chiếu:</strong> ${this.escapeHTML(q.referenceNote)}</p>` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}

                            <!-- Bottom Stage Controls -->
                            <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                                <button onclick="app.goToSessionQuestion(${sess.currentIndex - 1})"
                                    ${sess.currentIndex === 0 ? 'disabled' : ''}
                                    class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-800 text-xs font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-arrow-left"></i> Câu trước
                                </button>

                                <div class="flex flex-wrap items-center gap-2.5">
                                    ${isTeacher ? `
                                        <button onclick="app.toggleRevealAnswer('${q.id}')"
                                            class="px-5 py-2.5 rounded-xl ${qState.answerRevealed ? 'bg-slate-800 text-white' : 'bg-amber-500 hover:bg-amber-600 text-white'} text-xs font-extrabold flex items-center gap-2 shadow-sm transition">
                                            <i class="fa-solid ${qState.answerRevealed ? 'fa-eye-slash' : 'fa-eye'}"></i>
                                            ${qState.answerRevealed ? 'Ẩn đáp án' : 'Hiện đáp án'}
                                        </button>
                                    ` : `
                                        <button onclick="app.confirmSubmitStudentPractice()"
                                            class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center gap-2 shadow-sm">
                                            <i class="fa-solid fa-paper-plane"></i> Nộp bài & Chấm điểm
                                        </button>
                                    `}
                                </div>

                                ${sess.currentIndex < total - 1 ? `
                                    <button onclick="app.goToSessionQuestion(${sess.currentIndex + 1})"
                                        class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-2 shadow-2xs">
                                        Câu tiếp theo <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                ` : `
                                    <button onclick="${isTeacher ? 'app.confirmEndSession()' : 'app.confirmSubmitStudentPractice()'}"
                                        class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold flex items-center gap-2 shadow-sm">
                                        <i class="fa-solid fa-flag-checkered"></i> Hoàn thành lượt kiểm tra
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;

                this.updateTimerDisplayUI();
            },

            goToSessionQuestion(targetIndex) {
                const sess = this.state.activeSession;
                if (!sess) return;
                if (targetIndex < 0 || targetIndex >= sess.questions.length) return;

                // Quy tắc X.8: Khi chuyển câu, phải dừng bộ đếm của câu trước và thiết lập đồng hồ phù hợp cho câu mới (không tự chạy)
                this.resetTimerToDuration(sess.config.defaultTimer);
                sess.currentIndex = targetIndex;
                this.renderView();
            },

            selectOptionInSession(qId, optKey) {
                const sess = this.state.activeSession;
                if (!sess) return;
                const qState = sess.questionStates[qId];
                if (!qState) return;

                // Trong chế độ học sinh tự làm bài, nếu chưa nộp bài thì cho phép chọn/thay đổi
                // Trong chế độ giáo viên trình chiếu, giáo viên cũng có thể nhấn chọn phương án đại diện của lớp trước khi bấm Hiện đáp án
                if (sess.mode === 'student_practice' && sess.submitted) return;
                qState.selectedOption = qState.selectedOption === optKey ? null : optKey;
                this.renderView();
            },

            toggleRevealAnswer(qId) {
                const sess = this.state.activeSession;
                if (!sess) return;
                const qState = sess.questionStates[qId];
                if (!qState) return;
                qState.answerRevealed = !qState.answerRevealed;
                if (qState.answerRevealed) qState.explanationVisible = true;
                this.renderView();
            },

            toggleExplanationVisibility(qId) {
                const sess = this.state.activeSession;
                if (!sess) return;
                const qState = sess.questionStates[qId];
                if (!qState) return;
                qState.explanationVisible = !qState.explanationVisible;
                this.renderView();
            },

            toggleStudentFlagQuestion(qId) {
                const sess = this.state.activeSession;
                if (!sess) return;
                const qState = sess.questionStates[qId];
                if (!qState) return;
                qState.flaggedForReview = !qState.flaggedForReview;
                this.renderView();
            },

            confirmSubmitStudentPractice() {
                const sess = this.state.activeSession;
                if (!sess) return;
                const total = sess.questions.length;
                const answered = Object.values(sess.questionStates).filter(s => Boolean(s.selectedOption)).length;
                const unanswered = total - answered;

                this.showModal({
                    title: 'Xác nhận nộp bài kiểm tra',
                    body: `
                        <div class="space-y-2 text-xs text-slate-700">
                            <p>Bạn đã trả lời <strong>${answered} / ${total}</strong> câu hỏi.</p>
                            ${unanswered > 0 ? `<p class="text-amber-700 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Còn ${unanswered} câu hỏi đang bỏ trống!</p>` : ''}
                            <p>Bạn có chắc chắn muốn nộp bài để chấm điểm và xem kết quả tổng kết không?</p>
                        </div>
                    `,
                    footer: `
                        <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Kiểm tra lại bài</button>
                        <button onclick="app.finalizeSession()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Nộp bài ngay</button>
                    `
                });
            },

            confirmEndSession() {
                this.showModal({
                    title: 'Kết thúc lượt kiểm tra / trình chiếu?',
                    body: `<p class="text-xs text-slate-600">Đồng hồ đếm ngược sẽ dừng lại và ứng dụng chuyển sang màn hình Tổng kết lượt kiểm tra.</p>`,
                    footer: `
                        <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Tiếp tục hoạt động</button>
                        <button onclick="app.finalizeSession()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Kết thúc & Xem tổng kết</button>
                    `
                });
            },

            finalizeSession() {
                // Quy tắc X.10: Khi kết thúc lượt kiểm tra, dừng mọi bộ đếm đang hoạt động
                this.stopTimerInterval();
                this.closeModal();

                const sess = this.state.activeSession;
                if (!sess) return;
                sess.finishedAt = new Date().toISOString();
                sess.submitted = true;

                const quiz = this.getQuiz(sess.quizSetId);
                if (quiz) {
                    quiz.status = 'COMPLETED';
                }

                // Lưu vào lịch sử lượt kiểm tra
                this.state.sessions.unshift(JSON.parse(JSON.stringify(sess)));
                this.saveToStorage();
                this.navigate('summary', sess.quizSetId);
            },

            renderSummaryView(ws) {
                const sess = this.state.activeSession || this.state.sessions.find(s => s.quizSetId === this.state.selectedQuizId);
                if (!sess) return this.navigate('dashboard');

                const total = sess.questions.length;
                let answeredCount = 0;
                let correctCount = 0;
                let wrongCount = 0;
                let revealedCount = 0;
                const reviewNeededList = [];

                sess.questions.forEach((q, idx) => {
                    const st = sess.questionStates[q.id] || {};
                    if (st.answerRevealed) revealedCount++;
                    if (st.selectedOption) {
                        answeredCount++;
                        if (st.selectedOption === q.correctAnswer) {
                            correctCount++;
                        } else {
                            wrongCount++;
                            reviewNeededList.push({ index: idx + 1, question: q, state: st });
                        }
                    } else {
                        reviewNeededList.push({ index: idx + 1, question: q, state: st });
                    }
                });

                const blankCount = total - answeredCount;
                const accuracyRate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
                const isTeacher = sess.mode === 'teacher_present';
                const hasRecordedChoices = answeredCount > 0;

                ws.innerHTML = `
                    <div class="max-w-5xl mx-auto space-y-6 pb-12">
                        <!-- Summary Hero Card -->
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-6 space-y-5">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                                <div>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isTeacher ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'}">
                                        ${isTeacher ? 'Báo cáo Chế độ Giáo viên Trình chiếu' : 'Kết quả Chế độ Học sinh Tự làm bài'}
                                    </span>
                                    <h3 class="text-xl font-extrabold text-slate-900 mt-2">${this.escapeHTML(sess.quizTitle)}</h3>
                                    <p class="text-xs text-slate-500">Hoàn thành lúc: ${new Date(sess.finishedAt || Date.now()).toLocaleString('vi-VN')}</p>
                                </div>

                                <div class="flex flex-wrap items-center gap-2">
                                    <button onclick="app.retrySameSession()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-2xs">
                                        <i class="fa-solid fa-rotate-right"></i> Làm lại bài
                                    </button>
                                    <button onclick="app.exportSessionReport()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
                                        <i class="fa-solid fa-file-export"></i> Xuất kết quả JSON
                                    </button>
                                    <button onclick="app.navigate('dashboard')" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold">
                                        Trở về danh sách bài học
                                    </button>
                                </div>
                            </div>

                            ${isTeacher && !hasRecordedChoices ? `
                                <!-- Honest Technical Report for Teacher Presentation without Student Answer Recording -->
                                <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-950 space-y-1.5 leading-relaxed">
                                    <p class="font-bold"><i class="fa-solid fa-circle-info text-blue-600 mr-1"></i> Tổng kết hoạt động trình chiếu trên lớp</p>
                                    <p>Trong lượt trình chiếu này, Giáo viên đã điều khiển trình chiếu <strong>${total} câu hỏi</strong> (đã mở đáp án giải thích trực tiếp trên lớp <strong>${revealedCount}/${total} câu</strong>). Hệ thống không tự tạo điểm số giả định của lớp học khi không ghi nhận lựa chọn trả lời từng câu.</p>
                                </div>
                            ` : ''}

                            <!-- Metrics Grid -->
                            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-center">
                                    <div class="text-2xl font-extrabold text-slate-900">${total}</div>
                                    <div class="text-xs text-slate-500 mt-0.5">Tổng số câu hỏi</div>
                                </div>
                                <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-center">
                                    <div class="text-2xl font-extrabold text-blue-700">${answeredCount}</div>
                                    <div class="text-xs text-blue-700 mt-0.5">Số câu đã trả lời</div>
                                </div>
                                <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-center">
                                    <div class="text-2xl font-extrabold text-amber-700">${blankCount}</div>
                                    <div class="text-xs text-amber-700 mt-0.5">Số câu bỏ trống</div>
                                </div>
                                <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-center">
                                    <div class="text-2xl font-extrabold text-emerald-700">${correctCount} / ${wrongCount}</div>
                                    <div class="text-xs text-emerald-800 mt-0.5">Số câu Đúng / Sai</div>
                                </div>
                                <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-200 text-center col-span-2 sm:col-span-1">
                                    <div class="text-2xl font-extrabold text-indigo-700">${hasRecordedChoices ? accuracyRate + '%' : '—'}</div>
                                    <div class="text-xs text-indigo-800 mt-0.5">Tỷ lệ trả lời đúng</div>
                                </div>
                            </div>
                        </div>

                        <!-- Questions needing review -->
                        ${hasRecordedChoices && reviewNeededList.length > 0 ? `
                            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 space-y-2">
                                <h4 class="text-xs font-extrabold uppercase tracking-wider text-amber-900">
                                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> Các câu hỏi cần xem lại (Sai hoặc bỏ trống: ${reviewNeededList.length} câu)
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${reviewNeededList.map(item => `
                                        <a href="#summary_q_${item.index}" class="px-3 py-1 rounded-lg bg-white border border-amber-300 text-xs font-bold text-amber-900 hover:bg-amber-100">
                                            Câu ${item.index}: ${this.escapeHTML(item.question.topic || item.question.cognitiveLevel)}
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Detailed Question-by-Question Review & Explanation -->
                        <div class="space-y-4">
                            <h4 class="text-sm font-extrabold text-slate-800">Chi tiết từng câu hỏi và lời giải</h4>
                            ${sess.questions.map((q, idx) => {
                                const st = sess.questionStates[q.id] || {};
                                const sel = st.selectedOption;
                                const isCorrect = sel && sel === q.correctAnswer;
                                const canShowExp = isTeacher || sess.config.allowExplanation;

                                return `
                                    <div id="summary_q_${idx + 1}" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 shadow-2xs">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <div class="flex items-center gap-2">
                                                <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold">Câu ${idx + 1}</span>
                                                <span class="text-xs font-semibold text-slate-500">${this.escapeHTML(q.cognitiveLevel)} • ${this.escapeHTML(q.topic || '')}</span>
                                            </div>
                                            <div>
                                                ${!sel ? `
                                                    <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">Chưa chọn phương án</span>
                                                ` : isCorrect ? `
                                                    <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>Trả lời Đúng (${sel})</span>
                                                ` : `
                                                    <span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 text-xs font-bold"><i class="fa-solid fa-xmark mr-1"></i>Trả lời Sai (Chọn ${sel})</span>
                                                `}
                                            </div>
                                        </div>

                                        <p class="text-sm font-bold text-slate-900">${this.escapeHTML(q.content)}</p>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            ${q.options.map(opt => {
                                                const isAns = canShowExp && q.correctAnswer === opt.key;
                                                const isUserSel = sel === opt.key;
                                                let cls = 'bg-slate-50 border-slate-200 text-slate-700';
                                                if (isAns) cls = 'bg-emerald-50 border-emerald-400 text-emerald-900 font-bold';
                                                else if (isUserSel && !isAns) cls = 'bg-rose-50 border-rose-300 text-rose-900 font-semibold';
                                                return `
                                                    <div class="px-3 py-2 rounded-xl border text-xs flex items-center justify-between ${cls}">
                                                        <span><strong>${opt.key}.</strong> ${this.escapeHTML(opt.text)}</span>
                                                        ${isAns ? '<i class="fa-solid fa-check text-emerald-600"></i>' : ''}
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>

                                        ${canShowExp ? `
                                            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs text-slate-700 space-y-1">
                                                <p><strong class="text-emerald-700">Đáp án đúng: ${this.escapeHTML(q.correctAnswer)}</strong></p>
                                                <p><strong>Lời giải:</strong> ${this.escapeHTML(q.explanation || 'Chưa có lời giải.')}</p>

                const idxB = this.state.quizSets.findIndex(q => q.id === lessonQuizzes[targetPos].id);
                const temp = this.state.quizSets[idxA];
                this.state.quizSets[idxA] = this.state.quizSets[idxB];

            extractDriveFolderId(inputStr) {
                if (!inputStr) return '';
                const str = inputStr.trim();
                // Nếu người dùng dán nguyên link dạng https://drive.google.com/drive/folders/1a2b3c4d5e...
                const match = str.match(/\/folders\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) return match[1];
                // Nếu dán link dạng ?id=1a2b3c...
                const idMatch = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) return idMatch[1];
                // Nếu chỉ dán chuỗi ID trực tiếp
                if (/^[a-zA-Z0-9_-]{15,}$/.test(str)) return str;
                return '';
            },

            generateAppsScriptCode(folderId) {
                const targetId = folderId || 'DÁN_ID_THƯ_MỤC_DRIVE_VÀO_ĐÂY';
                return `// MÃ CẦU NỐI GOOGLE DRIVE CHO ỨNG DỤNG QUIZ STUDIO
const FOLDER_ID = "${targetId}";
const FILE_NAME = "quiz-studio-database.json";

function doPost(e) {
  try {
    const folder = DriveApp.getFolderById(FOLDER_ID);
    const content = e.postData.contents;
    const files = folder.getFilesByName(FILE_NAME);
    if (files.hasNext()) {
      const file = files.next();
      file.setContent(content);
    } else {
      folder.createFile(FILE_NAME, content, MimeType.PLAIN_TEXT);
    }
    return ContentService.createTextOutput(JSON.stringify({
      status: "success",
      updatedAt: new Date().toISOString()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  try {
    const folder = DriveApp.getFolderById(FOLDER_ID);
    const files = folder.getFilesByName(FILE_NAME);
    if (files.hasNext()) {
      const file = files.next();
      return ContentService.createTextOutput(file.getBlob().getDataAsString())
        .setMimeType(ContentService.MimeType.JSON);
    } else {
      return ContentService.createTextOutput(JSON.stringify({
        status: "empty",
        message: "Chưa có tệp dữ liệu trong thư mục Drive này."
      })).setMimeType(ContentService.MimeType.JSON);
    }
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}`;
            },

                                    class="w-full p-2.5 bg-slate-900 text-emerald-300 font-mono text-[11px] rounded-xl border border-slate-700 focus:outline-none">${this.escapeHTML(scriptCode)}</textarea>
                            </div>

                            <!-- Bước 3: Dán URL Web App -->
                            <div class="p-3.5 rounded-xl bg-blue-50/60 border border-blue-200 space-y-2">
                                <label class="block font-bold text-slate-900">
                                    Bước 3: Dán URL Ứng dụng Web (Web App URL) từ Google Apps Script vào đây
                                </label>
                                <input id="driveScriptUrlInput" type="text" value="${this.escapeHTML(cfg.scriptUrl || '')}"
                                    placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                                    class="w-full px-3 py-2 bg-white border border-blue-300 rounded-xl text-xs font-mono focus:outline-none focus:border-blue-600">
                                <label class="inline-flex items-center gap-2 text-xs font-semibold text-slate-800 cursor-pointer pt-1">
                                    <input id="driveAutoSyncCheck" type="checkbox" ${cfg.autoSync !== false ? 'checked' : ''} class="rounded text-blue-600">
                                    Tự động đồng bộ theo thời gian thực mỗi khi thêm/sửa Bài học, Bộ câu hỏi hoặc Kết quả kiểm tra
                                </label>
                            </div>
                        </div>
                    `,
                    footer: `
                        <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Đóng</button>
                        <button onclick="app.saveDriveConfigAndTest()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs">
                            <i class="fa-solid fa-cloud-bolt"></i> Lưu cấu hình & Đồng bộ ngay
                        </button>
                    `
                });
            },

            onDriveFolderInputChanged(val) {
                const folderId = this.extractDriveFolderId(val);
                const labelEl = document.getElementById('detectedFolderIdLabel');
                const codeBox = document.getElementById('generatedAppsScriptBox');
                if (labelEl) {
                    labelEl.textContent = folderId || 'Chưa nhận diện được ID (Hãy dán link thư mục Google Drive)';
                }
                if (codeBox) {
                    codeBox.value = this.generateAppsScriptCode(folderId);
                }
            },

            copyAppsScriptCode() {
                const codeBox = document.getElementById('generatedAppsScriptBox');
                if (!codeBox) return;
                codeBox.select();
                document.execCommand('copy');
                this.toast('Đã sao chép mã Google Apps Script vào bộ nhớ tạm!', 'success');
            },

            async saveDriveConfigAndTest() {
                const folderUrl = (document.getElementById('driveFolderUrlInput')?.value || '').trim();
                const scriptUrl = (document.getElementById('driveScriptUrlInput')?.value || '').trim();
                const autoSync = Boolean(document.getElementById('driveAutoSyncCheck')?.checked);
                const folderId = this.extractDriveFolderId(folderUrl);

                this.state.driveConfig = {
                    ...this.state.driveConfig,
                    folderUrl,
                    folderId,
                    scriptUrl,
                    autoSync
                };
                this.saveToStorage(true);
                this.updateDriveStatusUI();
                this.closeModal();

                if (!scriptUrl) {
                    this.toast('Đã lưu link thư mục. Vui lòng dán thêm Web App URL ở Bước 3 để kích hoạt đồng bộ tự động!', 'warning');
                    return;
                }

                await this.syncToGoogleDrive(true);
            },

            scheduleAutoDriveSync() {
                if (this.state.driveAutoSyncTimer) {
                    clearTimeout(this.state.driveAutoSyncTimer);
                }
                this.updateDriveStatusUI('pending');
                this.state.driveAutoSyncTimer = setTimeout(() => {
                    this.syncToGoogleDrive(false);
                }, 2000);
            },

            async syncToGoogleDrive(showToastNotification = false) {
                const scriptUrl = (this.state.driveConfig.scriptUrl || '').trim();
                if (!scriptUrl) {
                    if (showToastNotification) {
                        this.openDriveSyncModal();
                    }
                    return;
                }

                if (this.state.driveSyncing) return;
                this.state.driveSyncing = true;
                this.updateDriveStatusUI('syncing');

                const payload = {
                    app: 'QUIZ_STUDIO',
                    version: '1.0',
                    syncedAt: new Date().toISOString(),
                    lessons: this.state.lessons,
                    quizSets: this.state.quizSets,
                    sessions: this.state.sessions
                };

                try {
                    // Sử dụng text/plain để tránh lỗi CORS preflight (OPTIONS) trên Google Apps Script Web App
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const resJson = await response.json();
                    if (resJson.status === 'error') {
                        throw new Error(resJson.message || 'Lỗi từ Google Apps Script');
                    }

                    this.state.driveConfig.lastSyncedAt = new Date().toISOString();
                    this.saveToStorage(true);
                    this.state.driveSyncing = false;
                    this.updateDriveStatusUI('synced');

                    if (showToastNotification) {
                        this.toast('Đã lưu toàn bộ dữ liệu lên thư mục Google Drive thành công!', 'success');
                    }
                } catch (err) {
                    console.warn('Lỗi đồng bộ Google Drive:', err);
                    this.state.driveSyncing = false;
                    this.updateDriveStatusUI('error');
                    if (showToastNotification) {
                        this.toast(`Không thể lưu lên Google Drive: ${err.message}. Hãy kiểm tra lại Web App URL hoặc quyền truy cập "Bất kỳ ai (Anyone)".`, 'error');
                    }
                }
            },

            async pullFromGoogleDrive(askConfirmation = true) {
                const scriptUrl = (this.state.driveConfig.scriptUrl || '').trim();
                if (!scriptUrl) {
                    this.openDriveSyncModal();
                    return;
                }

                if (askConfirmation) {
                    this.showModal({
                        title: 'Tải dữ liệu từ Google Drive về máy?',
                        body: `
                            <p class="text-xs text-slate-700 leading-relaxed">
                                Hệ thống sẽ tải tệp <code>quiz-studio-database.json</code> mới nhất từ thư mục Google Drive của Thầy/Cô và cập nhật vào ứng dụng hiện tại.
                            </p>
                        `,
                        footer: `
                            <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Hủy</button>
                            <button onclick="app.closeModal(); app.pullFromGoogleDrive(false);" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">
                                <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Tải về ngay
                            </button>
                        `
                    });
                    return;
                }

                this.state.driveSyncing = true;
                this.updateDriveStatusUI('syncing');

                try {
                    const response = await fetch(scriptUrl, { method: 'GET' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    if (data.status === 'empty') {
                        this.state.driveSyncing = false;
                        this.updateDriveStatusUI('ready');
                        this.toast('Thư mục Google Drive hiện chưa có tệp dữ liệu. Hãy nhấn nút Lưu lên Drive trước!', 'warning');
                        return;
                    }
                    if (data.status === 'error') {
                        throw new Error(data.message || 'Lỗi đọc tệp trên Google Drive');
                    }

                    if (!Array.isArray(data.lessons) || !Array.isArray(data.quizSets)) {
                        throw new Error('Dữ liệu trên Google Drive không đúng cấu trúc QUIZ STUDIO.');
                    }

                    this.state.lessons = data.lessons;
                    this.state.quizSets = data.quizSets;
                    this.state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
                    this.state.selectedLessonId = this.state.lessons[0]?.id || null;
                    this.state.selectedQuizId = null;
                    this.state.driveConfig.lastSyncedAt = new Date().toISOString();

                    this.saveToStorage(true);
                    this.state.driveSyncing = false;
                    this.updateDriveStatusUI('synced');
                    this.navigate('dashboard');
                    this.toast(`Đã tải thành công ${data.lessons.length} bài học và ${data.quizSets.length} bộ câu hỏi từ Google Drive!`, 'success');
                } catch (err) {
                    this.state.driveSyncing = false;
                    this.updateDriveStatusUI('error');
                    this.toast(`Lỗi tải dữ liệu từ Google Drive: ${err.message}`, 'error');
                }
            },

            updateDriveStatusUI(stateOverride = null) {
                const dot = document.getElementById('driveSyncDot');
                const text = document.getElementById('driveSyncStatusText');
                const sub = document.getElementById('driveLastSyncTime');
                const spinner = document.getElementById('driveSyncSpinner');
                if (!dot || !text || !sub) return;

                const cfg = this.state.driveConfig;
                if (!cfg.scriptUrl) {
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-500';
                    text.textContent = 'Google Drive: Chưa kết nối';
                    sub.textContent = 'Nhấn để cài đặt lưu tự động';
                    if (spinner) spinner.className = 'fa-solid fa-cloud-arrow-up';
                    return;
                }

                if (stateOverride === 'syncing') {
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-blue-400 animate-ping';
                    text.textContent = 'Google Drive: Đang đồng bộ...';
                    sub.textContent = 'Đang truyền dữ liệu đám mây';
                    if (spinner) spinner.className = 'fa-solid fa-circle-notch fa-spin';
                } else if (stateOverride === 'pending') {
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
                    text.textContent = 'Google Drive: Chờ tự động lưu...';
                    sub.textContent = 'Sẽ lưu sau vài giây...';
                    if (spinner) spinner.className = 'fa-solid fa-cloud-arrow-up';
                } else if (stateOverride === 'error') {
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
                    text.textContent = 'Google Drive: Lỗi kết nối';
                    sub.textContent = 'Nhấn để kiểm tra cấu hình';
                    if (spinner) spinner.className = 'fa-solid fa-triangle-exclamation text-rose-400';
                } else {
                    dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
                    text.textContent = cfg.autoSync ? 'Google Drive: Tự động lưu BẬT' : 'Google Drive: Đã kết nối';
                    sub.textContent = cfg.lastSyncedAt
                        ? `Đã lưu: ${new Date(cfg.lastSyncedAt).toLocaleTimeString('vi-VN')}`
                        : 'Sẵn sàng đồng bộ đám mây';
                    if (spinner) spinner.className = 'fa-solid fa-cloud-arrow-up';
                }
            },

            openArchitectureModal() {
                this.showModal({
                    title: 'Kiến trúc Hệ thống & Hướng dẫn Sử dụng QUIZ STUDIO',
                    body: `
                        <div class="space-y-3 text-xs text-slate-700 leading-relaxed">
                            <div class="p-3 rounded-xl bg-slate-100 border border-slate-200">
                                <p class="font-bold text-slate-900">1. Quy trình 8 bước bắt buộc:</p>
                                <p class="mt-1">Nhập dữ liệu → Tạo dự thảo (AI hoặc Cục bộ) → Giáo viên duyệt → Xác nhận bộ câu hỏi → Cấu hình chế độ → Nhấn Bắt đầu → Tổ chức kiểm tra → Tổng kết.</p>
                            </div>
                            <div class="p-3 rounded-xl bg-slate-100 border border-slate-200">
                                <p class="font-bold text-slate-900">2. Cách lưu và mở tệp độc lập:</p>
                                <p class="mt-1">Toàn bộ ứng dụng nằm gọn trong một tệp <code>index.html</code> duy nhất. Thầy/Cô có thể lưu tệp này về máy tính, mở trực tiếp bằng Chrome/Edge/Safari mà không cần cài đặt Node.js hay máy chủ.</p>
                            </div>
                            <div class="p-3 rounded-xl bg-slate-100 border border-slate-200">
                                <p class="font-bold text-slate-900">3. Giới hạn trung thực của bản HTML độc lập:</p>
                                <p class="mt-1">• Dữ liệu được lưu cục bộ trong <code>localStorage</code> của trình duyệt và hỗ trợ Xuất/Nhập tệp <code>.json</code> để mang sang máy chiếu trên lớp.<br>• Để đồng bộ kết quả trực tuyến từ nhiều điện thoại học sinh cùng lúc hoặc bảo mật tuyệt đối đáp án ở các kỳ thi chính thức, cần triển khai thêm máy chủ Backend.</p>
                            </div>
                        </div>
                    `,
                    footer: `
                        <button onclick="app.resetSampleDataConfirm()" class="px-3 py-2 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-semibold">Khôi phục dữ liệu mẫu ban đầu</button>
                        <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Đã hiểu</button>
                    `
                });
            },

            resetSampleDataConfirm() {
                this.state.lessons = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.lessons));
                this.state.quizSets = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.quizSets));
                this.state.sessions = [];
                this.state.selectedLessonId = this.state.lessons[0].id;
                this.state.selectedQuizId = null;
                this.saveToStorage();
                this.closeModal();
                this.navigate('dashboard');
                this.toast('Đã khôi phục bộ dữ liệu mẫu THPT mặc định.', 'success');
            },

            exportJSON() {
                const data = {
                    app: 'QUIZ_STUDIO',
                    version: '1.0',
                    exportedAt: new Date().toISOString(),
                    lessons: this.state.lessons,
                    quizSets: this.state.quizSets,
                    sessions: this.state.sessions
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `quiz-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.toast('Đã xuất toàn bộ Bài học và Bộ câu hỏi ra tệp JSON.', 'success');
            },

            importJSON(event) {
                const file = event.target?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!Array.isArray(parsed.lessons) || !Array.isArray(parsed.quizSets)) {
                            throw new Error('Cấu trúc tệp JSON không hợp lệ.');
                        }
                        this.state.lessons = parsed.lessons;
                        this.state.quizSets = parsed.quizSets;
                        this.state.sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
                        this.state.selectedLessonId = this.state.lessons[0]?.id || null;
                        this.state.selectedQuizId = null;
                        this.saveToStorage();
                        this.navigate('dashboard');
                        this.toast(`Đã khôi phục thành công ${parsed.lessons.length} bài học và ${parsed.quizSets.length} bộ câu hỏi!`, 'success');
                    } catch (err) {
                        this.toast('Lỗi đọc tệp JSON: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            },

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {
                        this.toast('Trình duyệt hiện tại không cho phép mở toàn màn hình.', 'warning');
                    });
                } else {
                    document.exitFullscreen();
                }
            },

            setupKeyboardShortcuts() {
                window.addEventListener('keydown', (e) => {
                    if (this.state.currentView !== 'session' || !this.state.activeSession) return;
                    const tag = (e.target?.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                    const sess = this.state.activeSession;
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        if (sess.currentIndex < sess.questions.length - 1) {
                            this.goToSessionQuestion(sess.currentIndex + 1);
                        }
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        if (sess.currentIndex > 0) {
                            this.goToSessionQuestion(sess.currentIndex - 1);
                        }
                    }
                });
            }
        };

        window.onload = function () {
            app.init();
        };
    </script>
</body>
</html>
