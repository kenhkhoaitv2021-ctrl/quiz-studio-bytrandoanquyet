                            content: 'Một trong những quyết định quan trọng của Hội nghị Ianta (2/1945) là thành lập tổ chức quốc tế nào nhằm duy trì hòa bình, an ninh thế giới?',
                            options: [
                                { key: 'A', text: 'Hội Quốc liên' },
                                { key: 'B', text: 'Liên hợp quốc' },
                                { key: 'C', text: 'Hiệp ước Bắc Đại Tây Dương (NATO)' },
                                { key: 'D', text: 'Liên minh châu Âu (EU)' }
                            ],
                            correctAnswer: '',
                            explanation: 'Cần giáo viên chọn đáp án đúng và kiểm chứng lại lời giải.',
                            referenceNote: 'Tài liệu đầu vào chưa ghi rõ đáp án câu 2',
                            cognitiveLevel: 'Nhận biết',
                            topic: 'Hội nghị Ianta',
                            needsReview: true,
                            duplicateWarning: false
                        }
                    ]
                }
            ],
            sessions: [],
            aiConfig: {
                enabled: true,
                mode: 'auto', // 'auto' uses Canvas runtime key or user proxy/session key
                customEndpoint: '',
                sessionApiKey: ''
            },
            driveConfig: {
                folderUrl: '',
                folderId: '',
                scriptUrl: '',
                autoSync: true,
                lastSyncedAt: null
            }
        };

        const app = {
            state: {
                lessons: [],
                quizSets: [],
                sessions: [],
                aiConfig: { enabled: true, mode: 'auto', customEndpoint: '', sessionApiKey: '' },
                driveConfig: {
                    folderUrl: '',
                    folderId: '',
                    scriptUrl: '',
                    autoSync: true,
                    lastSyncedAt: null
                },
                driveSyncing: false,
                driveAutoSyncTimer: null,
                currentView: 'dashboard', // 'dashboard' | 'input' | 'review' | 'config' | 'session' | 'summary'
                selectedLessonId: null,
                selectedQuizId: null,
                activeSession: null,
                // Timer state (single isolated interval)
                timer: {
                    selectedDuration: 20,
                    remainingSeconds: 20,
                    status: 'IDLE', // 'IDLE' | 'RUNNING' | 'PAUSED' | 'EXPIRED'
                    intervalId: null
                },
                aiProcessing: false,
                aiStatusMessage: ''
            },

            init() {
                this.loadFromStorage();
                if (!this.state.selectedLessonId && this.state.lessons.length > 0) {
                    this.state.selectedLessonId = this.state.lessons[0].id;
                }
                this.updateAIStatusUI();
                this.updateDriveStatusUI();
                this.renderSidebar();
                this.renderView();
                this.setupKeyboardShortcuts();

                // Nếu đã cấu hình Google Drive Web App URL và bật tự động đồng bộ, kiểm tra dữ liệu khi khởi động
                if (this.state.driveConfig.scriptUrl && this.state.driveConfig.autoSync) {
                    this.updateDriveStatusUI('ready');
                }
            },

            loadFromStorage() {
                try {
                    const raw = localStorage.getItem('QUIZ_STUDIO_STATE_V1');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        this.state.lessons = Array.isArray(parsed.lessons) ? parsed.lessons : DEFAULT_SAMPLE_DATA.lessons;
                        this.state.quizSets = Array.isArray(parsed.quizSets) ? parsed.quizSets : DEFAULT_SAMPLE_DATA.quizSets;
                        this.state.sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
                        if (parsed.aiConfig) {
                            this.state.aiConfig = { ...this.state.aiConfig, ...parsed.aiConfig, sessionApiKey: '' };
                        }
                        if (parsed.driveConfig) {
                            this.state.driveConfig = { ...this.state.driveConfig, ...parsed.driveConfig };
                        }
                    } else {
                        this.state.lessons = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.lessons));
                        this.state.quizSets = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.quizSets));
                        this.state.sessions = [];
                        this.saveToStorage(true);
                    }
                } catch (err) {
                    console.error('Lỗi đọc localStorage:', err);
                    this.state.lessons = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.lessons));
                    this.state.quizSets = JSON.parse(JSON.stringify(DEFAULT_SAMPLE_DATA.quizSets));
                }
            },

            saveToStorage(skipCloudSync = false) {
                try {
                    const payload = {
                        lessons: this.state.lessons,
                        quizSets: this.state.quizSets,
                        sessions: this.state.sessions,
                        aiConfig: {
                            enabled: this.state.aiConfig.enabled,
                            mode: this.state.aiConfig.mode,
                            customEndpoint: this.state.aiConfig.customEndpoint
                        },
                        driveConfig: this.state.driveConfig
                    };
                    localStorage.setItem('QUIZ_STUDIO_STATE_V1', JSON.stringify(payload));

                    // Tự động đồng bộ lên Google Drive (debounce 2.5 giây sau mỗi thao tác sửa/lưu)
                    if (!skipCloudSync && this.state.driveConfig.scriptUrl && this.state.driveConfig.autoSync) {
                        this.scheduleAutoDriveSync();
                    }
                } catch (err) {
                    this.toast('Không thể lưu vào bộ nhớ trình duyệt (có thể đầy dung lượng).', 'error');
                }
            },

            toast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const el = document.createElement('div');
                const styles = {
                    info: 'bg-slate-900 text-white border-slate-700',
                    success: 'bg-emerald-700 text-white border-emerald-500',
                    warning: 'bg-amber-600 text-white border-amber-400',
                    error: 'bg-rose-700 text-white border-rose-500'
                };
                const icons = {
                    info: 'fa-circle-info text-blue-300',
                    success: 'fa-circle-check text-emerald-200',
                    warning: 'fa-triangle-exclamation text-amber-200',
                    error: 'fa-circle-xmark text-rose-200'
                };
                el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs font-medium transition-all duration-300 ${styles[type] || styles.info}`;
                el.innerHTML = `
                    <i class="fa-solid ${icons[type] || icons.info} mt-0.5 text-sm"></i>
                    <div class="flex-1 leading-relaxed">${this.escapeHTML(message)}</div>
                `;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3800);
            },

            escapeHTML(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            },

            getLesson(id) {
                return this.state.lessons.find(l => l.id === id) || null;
            },

            getQuiz(id) {
                return this.state.quizSets.find(q => q.id === id) || null;
            },

            toggleSidebar() {
                const sb = document.getElementById('leftSidebar');
                sb.classList.toggle('hidden');
            },

            navigate(view, quizId = null, lessonId = null) {
                // Nếu đang ở trong lượt kiểm tra, dừng đồng hồ trước khi chuyển màn hình
                if (this.state.currentView === 'session' && view !== 'session') {
                    this.stopTimerInterval();
                }

                if (lessonId) this.state.selectedLessonId = lessonId;
                if (quizId) {
                    this.state.selectedQuizId = quizId;
                    const q = this.getQuiz(quizId);
                    if (q) this.state.selectedLessonId = q.lessonId;
                }

                const currentQuiz = this.getQuiz(this.state.selectedQuizId);

                // QUY TẮC BẢO VỆ BẮT BUỘC: Không được vào Cấu hình hoặc Kiểm tra nếu bộ câu hỏi chưa được XÁC NHẬN
                if ((view === 'config' || view === 'session') && currentQuiz) {
                    if (currentQuiz.status !== 'APPROVED' && currentQuiz.status !== 'IN_USE' && currentQuiz.status !== 'COMPLETED') {
                        this.toast('Quy tắc bắt buộc: Bộ câu hỏi phải được Giáo viên duyệt và nhấn "Xác nhận bộ câu hỏi" trước khi cấu hình hoặc bắt đầu kiểm tra!', 'warning');
                        this.state.currentView = 'review';
                        this.renderSidebar();
                        this.renderView();
                        return;
                    }
                }

                this.state.currentView = view;
                this.renderSidebar();
                this.renderView();
            },

            /**
             * Hàm bảo vệ tính toàn vẹn: Khi một bộ câu hỏi đã xác nhận bị chỉnh sửa nội dung,
             * tự động chuyển về trạng thái CHỜ DUYỆT (PENDING_APPROVAL) để giáo viên xác nhận lại.
             */
            markQuizModified(quiz) {
                if (!quiz) return;
                quiz.updatedAt = new Date().toISOString();
                if (quiz.questions.length === 0) {
                    quiz.status = 'EMPTY';
                    quiz.approvedAt = null;
                } else if (quiz.status === 'APPROVED' || quiz.status === 'COMPLETED' || quiz.status === 'IN_USE') {
                    quiz.status = 'PENDING_APPROVAL';
                    quiz.approvedAt = null;
                    this.toast('Bộ câu hỏi đã có thay đổi nội dung nên được chuyển về trạng thái "Chờ duyệt". Vui lòng xác nhận lại sau khi sửa xong.', 'warning');
                } else if (quiz.status === 'EMPTY') {
                    quiz.status = 'DRAFTING';
                }
                this.saveToStorage();
                this.renderSidebar();
                this.renderHeaderBar();
            },

            renderSidebar() {
                const treeEl = document.getElementById('sidebarTree');
                const searchVal = (document.getElementById('sidebarSearch')?.value || '').trim().toLowerCase();
                const statusFilter = document.getElementById('sidebarStatusFilter')?.value || 'ALL';

                if (this.state.lessons.length === 0) {
                    treeEl.innerHTML = `
                        <div class="text-center py-8 px-4 bg-slate-800/40 rounded-xl border border-dashed border-slate-700">
                            <i class="fa-solid fa-folder-open text-2xl text-slate-500 mb-2"></i>
                            <p class="text-xs text-slate-400 mb-3">Chưa có bài học nào trong hệ thống.</p>
                            <button onclick="app.openLessonModal()" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold">
                                + Tạo bài học đầu tiên
                            </button>
                        </div>
                    `;
                    return;
                }

                let html = '';
                this.state.lessons.forEach(lesson => {
                    const lessonQuizzes = this.state.quizSets.filter(q => q.lessonId === lesson.id);
                    const filteredQuizzes = lessonQuizzes.filter(q => {
                        const matchStatus = statusFilter === 'ALL' || q.status === statusFilter;
                        const matchText = !searchVal ||
                            lesson.title.toLowerCase().includes(searchVal) ||
                            q.title.toLowerCase().includes(searchVal);
                        return matchStatus && matchText;
                    });

                    const matchLessonDirect = !searchVal || lesson.title.toLowerCase().includes(searchVal);
                    if (!matchLessonDirect && filteredQuizzes.length === 0 && (searchVal || statusFilter !== 'ALL')) {
                        return;
                    }

                    const isSelectedLesson = this.state.selectedLessonId === lesson.id;

                    html += `
                        <div class="rounded-xl border ${isSelectedLesson ? 'border-slate-700 bg-slate-800/60' : 'border-slate-800/80 bg-slate-900/40'} overflow-hidden">
                            <!-- Lesson Header -->
                            <div class="px-3 py-2.5 flex items-center justify-between gap-2 cursor-pointer hover:bg-slate-800 transition"
                                 onclick="app.selectLesson('${lesson.id}')">
                                <div class="flex items-center gap-2 min-w-0">
                                    <i class="fa-solid fa-book-bookmark ${isSelectedLesson ? 'text-blue-400' : 'text-slate-400'} text-xs"></i>
                                    <span class="text-xs font-bold text-slate-100 truncate" title="${this.escapeHTML(lesson.title)}">
                                        ${this.escapeHTML(lesson.title)}
                                    </span>
                                </div>
                                <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
                                    <button onclick="app.openNewQuizModal('${lesson.id}')" class="p-1 text-slate-400 hover:text-blue-400 rounded" title="Thêm bộ câu hỏi vào bài này">
                                        <i class="fa-solid fa-plus text-[11px]"></i>
                                    </button>
                                    <button onclick="app.openLessonModal('${lesson.id}')" class="p-1 text-slate-400 hover:text-slate-200 rounded" title="Sửa bài học">
                                        <i class="fa-solid fa-pen text-[11px]"></i>
                                    </button>
                                    <button onclick="app.confirmDeleteLesson('${lesson.id}')" class="p-1 text-slate-400 hover:text-rose-400 rounded" title="Xóa bài học">
                                        <i class="fa-solid fa-trash text-[11px]"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Quiz Sets under Lesson -->
                            <div class="px-2 pb-2 space-y-1">
                                ${filteredQuizzes.length === 0 ? `
                                    <div class="px-2 py-1.5 text-[11px] text-slate-500 italic">Chưa có bộ câu hỏi phù hợp</div>
                                ` : filteredQuizzes.map((q, idx) => {
                                    const active = this.state.selectedQuizId === q.id && this.state.currentView !== 'dashboard';
                                    const st = STATUS_META[q.status] || STATUS_META.EMPTY;
                                    return `
                                        <div onclick="app.openQuizWorkspace('${q.id}')"
                                             class="group px-2.5 py-2 rounded-lg cursor-pointer transition flex items-start justify-between gap-2 ${active ? 'bg-blue-600/20 border border-blue-500/40 text-white' : 'hover:bg-slate-800/90 text-slate-300 border border-transparent'}">
                                            <div class="min-w-0 flex-1">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="w-2 h-2 rounded-full shrink-0 ${st.dot}" title="${st.label}"></span>
                                                    <p class="text-xs font-medium truncate">${this.escapeHTML(q.title)}</p>
                                                </div>
                                                <div class="flex items-center gap-2 mt-1 text-[10px] text-slate-400">
                                                    <span>${st.label}</span>
                                                    <span>•</span>
                                                    <span>${q.questions.length} câu</span>
                                                </div>
                                            </div>
                                            <div class="opacity-0 group-hover:opacity-100 flex items-center gap-0.5 shrink-0" onclick="event.stopPropagation()">
                                                <button onclick="app.moveQuizOrder('${q.id}', -1)" class="p-1 text-slate-400 hover:text-white" title="Chuyển lên">
                                                    <i class="fa-solid fa-arrow-up text-[10px]"></i>
                                                </button>
                                                <button onclick="app.moveQuizOrder('${q.id}', 1)" class="p-1 text-slate-400 hover:text-white" title="Chuyển xuống">
                                                    <i class="fa-solid fa-arrow-down text-[10px]"></i>
                                                </button>
                                                <button onclick="app.duplicateQuiz('${q.id}')" class="p-1 text-slate-400 hover:text-blue-300" title="Sao chép bộ câu hỏi">
                                                    <i class="fa-regular fa-copy text-[10px]"></i>
                                                </button>
                                                <button onclick="app.confirmDeleteQuiz('${q.id}')" class="p-1 text-slate-400 hover:text-rose-400" title="Xóa bộ câu hỏi">
                                                    <i class="fa-solid fa-trash text-[10px]"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });

                treeEl.innerHTML = html;
            },

            selectLesson(lessonId) {
                this.state.selectedLessonId = lessonId;
                this.state.currentView = 'dashboard';
                this.renderSidebar();
                this.renderView();
            },

            openQuizWorkspace(quizId) {
                const quiz = this.getQuiz(quizId);
                if (!quiz) return;
                this.state.selectedQuizId = quiz.id;
                this.state.selectedLessonId = quiz.lessonId;

                // Điều hướng thông minh theo trạng thái bộ câu hỏi
                if (quiz.status === 'EMPTY' || quiz.questions.length === 0) {
                    this.navigate('input', quiz.id);
                } else if (quiz.status === 'DRAFTING' || quiz.status === 'PENDING_APPROVAL') {
                    this.navigate('review', quiz.id);
                } else if (quiz.status === 'APPROVED' || quiz.status === 'COMPLETED' || quiz.status === 'IN_USE') {
                    this.navigate('review', quiz.id);
                }
            },

            renderHeaderBar() {
                const breadcrumbEl = document.getElementById('contextBreadcrumb');
                const titleEl = document.getElementById('contextTitle');
                const badgeEl = document.getElementById('contextStatusBadge');
                const stepperEl = document.getElementById('workflowStepper');
                const btnContainer = document.getElementById('contextualButtons');

                const quiz = this.getQuiz(this.state.selectedQuizId);
                const lesson = quiz ? this.getLesson(quiz.lessonId) : this.getLesson(this.state.selectedLessonId);

                if (this.state.currentView === 'dashboard' || !quiz) {
                    breadcrumbEl.textContent = lesson ? `Bài học: ${lesson.title}` : 'Không gian quản lý chung';
                    titleEl.textContent = 'Tổng quan Bài học & Bộ câu hỏi';
                    badgeEl.className = 'hidden';
                    stepperEl.classList.add('hidden');
                    btnContainer.innerHTML = `
                        <button onclick="app.openLessonModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-folder-plus"></i> Thêm bài học
                        </button>
                        <button onclick="app.openNewQuizModal('${lesson ? lesson.id : ''}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-xs transition">
                            <i class="fa-solid fa-plus"></i> Tạo bộ câu hỏi mới
                        </button>
                    `;
                    return;
                }

                // Khi đang làm việc với 1 bộ câu hỏi cụ thể
                breadcrumbEl.textContent = lesson ? `${lesson.title}` : 'Bộ câu hỏi';
                titleEl.textContent = quiz.title;
                const st = STATUS_META[quiz.status] || STATUS_META.EMPTY;
                badgeEl.className = `px-2.5 py-0.5 rounded-full text-xs font-semibold ${st.classes}`;
                badgeEl.textContent = st.label;

                // Hiển thị Workflow Stepper
                stepperEl.classList.remove('hidden');
                const steps = [
                    { key: 'input', label: '1. Nhập & Phân tích', icon: 'fa-file-import' },
                    { key: 'review', label: '2. Duyệt & Xác nhận', icon: 'fa-clipboard-check' },
                    { key: 'config', label: '3. Cấu hình chế độ', icon: 'fa-sliders' },
                    { key: 'session', label: '4. Tổ chức kiểm tra', icon: 'fa-play' },
                    { key: 'summary', label: '5. Tổng kết', icon: 'fa-chart-pie' }
                ];

                stepperEl.innerHTML = steps.map(s => {
                    const isActive = this.state.currentView === s.key;
                    const isLocked = (s.key === 'config' || s.key === 'session') && (quiz.status !== 'APPROVED' && quiz.status !== 'IN_USE' && quiz.status !== 'COMPLETED');
                    return `
                        <button onclick="app.navigate('${s.key}', '${quiz.id}')"
                            class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition ${isActive ? 'bg-blue-600 text-white shadow-xs' : isLocked ? 'text-slate-400 cursor-not-allowed' : 'text-slate-600 hover:bg-slate-200'}">
                            <i class="fa-solid ${isLocked ? 'fa-lock text-[10px]' : s.icon}"></i>
                            <span>${s.label}</span>
                        </button>
                    `;
                }).join('');

                // Các nút hành động theo ngữ cảnh hiện tại
                if (this.state.currentView === 'input') {
                    btnContainer.innerHTML = `
                        <button onclick="app.saveRawInputOnly()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu dữ liệu nhập
                        </button>
                        <button onclick="app.navigate('review', '${quiz.id}')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check"></i> Sang màn hình Duyệt (${quiz.questions.length})
                        </button>
                    `;
                } else if (this.state.currentView === 'review') {
                    const isApproved = quiz.status === 'APPROVED' || quiz.status === 'COMPLETED' || quiz.status === 'IN_USE';
                    btnContainer.innerHTML = `
                        <button onclick="app.navigate('input', '${quiz.id}')" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-left"></i> Nguồn văn bản
                        </button>
                        <button onclick="app.addBlankQuestion()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> Thêm câu hỏi
                        </button>
                        <button onclick="app.saveDraft('${quiz.id}')" class="px-3 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu bản dự thảo
                        </button>
                        ${!isApproved ? `
                            <button onclick="app.approveQuizSet('${quiz.id}')" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-circle-check"></i> Xác nhận bộ câu hỏi
                            </button>
                        ` : `
                            <button onclick="app.navigate('config', '${quiz.id}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-sliders"></i> Cấu hình & Tổ chức kiểm tra <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        `}
                    `;
                } else if (this.state.currentView === 'config') {
                    btnContainer.innerHTML = `
                        <button onclick="app.navigate('review', '${quiz.id}')" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-left"></i> Quay lại Duyệt câu hỏi
                        </button>
                        <button onclick="app.startConfiguredSession()" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-2 shadow-md">
                            <i class="fa-solid fa-play"></i> BẮT ĐẦU KIỂM TRA
                        </button>
                    `;
                } else if (this.state.currentView === 'session') {
                    btnContainer.innerHTML = `
                        <button onclick="app.toggleFullscreen()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
                            <i class="fa-solid fa-expand"></i> Toàn màn hình
                        </button>

            createEmptyQuestion(optionCount = 4, cognitiveLevel = 'Nhận biết', topic = '') {

                return {
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),

                    correctAnswer: 'A',
                    explanation: '',
                    referenceNote: '',
                    cognitiveLevel: COGNITIVE_LEVELS.includes(cognitiveLevel) ? cognitiveLevel : 'Nhận biết',
                    topic: topic || 'Kiến thức bài học',
                    needsReview: false,
                    duplicateWarning: false
                };
            },

            analyzeAndDraftManual() {
                const quiz = this.syncInputFieldsToQuiz();
                if (!quiz) return;
                const targetCount = parseInt(document.getElementById('inputTargetCount')?.value, 10) || 5;
                const raw = (quiz.rawInput || '').trim();

                if (!raw) {
                    this.toast('Vui lòng nhập hoặc dán văn bản trước khi phân tích!', 'warning');
                    return;
                }

                const parsedQuestions = this.parseRawDocumentDeterministically(raw, quiz.optionCount || 4, targetCount, quiz.cognitiveTarget, quiz.topicScope);

                if (parsedQuestions.length === 0) {
                    this.toast('Không tách được câu hỏi tự động. Hệ thống đã tạo khung câu hỏi thủ công để Thầy/Cô biên tập.', 'warning');
                    quiz.questions = [this.createEmptyQuestion(quiz.optionCount || 4, quiz.cognitiveTarget, quiz.topicScope)];
                } else {
                    quiz.questions = this.flagDuplicateQuestions(parsedQuestions);
                }

                quiz.status = 'PENDING_APPROVAL';
                quiz.approvedAt = null;
                this.saveToStorage();
                this.toast(`Đã tạo bản dự thảo gồm ${quiz.questions.length} câu hỏi. Mời Thầy/Cô kiểm tra và xác nhận!`, 'success');
                this.navigate('review', quiz.id);
            },

            parseRawDocumentDeterministically(rawText, optionCount, targetCount, defaultCognitive, defaultTopic) {
                const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const questions = [];
                const keys = ['A', 'B', 'C', 'D', 'E'].slice(0, optionCount);

                // Kiểm tra xem văn bản có cấu trúc Câu 1, Câu 2... hoặc A. B. C. D. không
                const hasQuestionMarkers = /(?:^|\n)\s*(?:Câu\s*\d+|Bài\s*\d+|\d+[\.\):])/i.test(rawText);

                if (hasQuestionMarkers) {
                    let currentQ = null;
                    for (const line of lines) {
                        const qMatch = line.match(/^(?:Câu\s*\d+|Bài\s*\d+|\d+)[\.\):\-]?\s*(.+)$/i);
                        const optMatch = line.match(/^([A-E])[\.\):\-]\s*(.+)$/i);
                        const ansMatch = line.match(/^(?:Đáp\s*án|ĐA|Correct|Answer)\s*[:\-]?\s*([A-E])/i);
                        const expMatch = line.match(/^(?:Lời\s*giải|Giải\s*thích|Hướng\s*dẫn)\s*[:\-]?\s*(.+)$/i);

                        if (qMatch && !optMatch && !ansMatch && !expMatch) {
                            if (currentQ) questions.push(this.finalizeParsedQuestion(currentQ, keys, defaultCognitive, defaultTopic));
                            currentQ = {
                                content: qMatch[1].trim(),
                                optionsMap: {},
                                correctAnswer: '',
                                explanation: '',
                                referenceNote: 'Tách từ đề cương văn bản'
                            };
                        } else if (optMatch && currentQ) {
                            const key = optMatch[1].toUpperCase();
                            let optText = optMatch[2].trim();
                            // Nếu có dấu * đánh dấu đáp án đúng ngay ở phương án
                            if (optText.startsWith('*') || optText.endsWith('(Đúng)')) {
                                currentQ.correctAnswer = key;
                                optText = optText.replace(/^\*+|\(Đúng\)$/gi, '').trim();
                            }
                            currentQ.optionsMap[key] = optText;
                        } else if (ansMatch && currentQ) {
                            currentQ.correctAnswer = ansMatch[1].toUpperCase();
                        } else if (expMatch && currentQ) {
                            currentQ.explanation = expMatch[1].trim();
                        } else if (currentQ) {
                            // Dòng nối tiếp
                            if (currentQ.explanation) {
                                currentQ.explanation += ' ' + line;
                            } else if (Object.keys(currentQ.optionsMap).length === 0) {
                                currentQ.content += ' ' + line;
                            }
                        }
                    }
                    if (currentQ) questions.push(this.finalizeParsedQuestion(currentQ, keys, defaultCognitive, defaultTopic));
                }

                // Nếu văn bản thuần túy chỉ chứa kiến thức (không có Câu 1, A, B, C, D) -> Tạo câu hỏi dự thảo từ các mệnh đề kiến thức
                if (questions.length === 0) {
                    const sentences = rawText
                        .split(/(?<=[\.\!\?\n])\s+/)
                        .map(s => s.trim())
                        .filter(s => s.length > 25);

                    const count = Math.min(targetCount, Math.max(1, sentences.length));
                    for (let i = 0; i < count; i++) {
                        const fact = sentences[i] || rawText.substring(0, 180);
                        const opts = keys.map((k, idx) => ({
                            key: k,
                            text: idx === 0
                                ? fact
                                : `[Phương án nhiễu ${k} - Giáo viên biên tập thêm dựa trên bài học]`
                        }));
                        questions.push({
                            id: 'q_' + Date.now() + '_' + i,
                            content: `Dựa vào nội dung bài học, nhận định nào sau đây phản ánh đúng kiến thức trọng tâm (Ý ${i + 1})?`,
                            options: opts,
                            correctAnswer: 'A',
                            explanation: `Căn cứ theo tài liệu gốc: "${fact}"`,
                            referenceNote: 'Trích xuất từ đoạn văn bản kiến thức (Cần giáo viên tinh chỉnh phương án nhiễu)',
                            cognitiveLevel: COGNITIVE_LEVELS.includes(defaultCognitive) ? defaultCognitive : 'Thông hiểu',
                            topic: defaultTopic || 'Kiến thức trọng tâm',
                            needsReview: true,
                            duplicateWarning: false
                        });
                    }
                }

                return questions;
            },

            finalizeParsedQuestion(rawQ, keys, defaultCognitive, defaultTopic) {
                const options = keys.map(k => ({
                    key: k,
                    text: rawQ.optionsMap[k] || ''
                }));
                const hasMissingOption = options.some(o => !o.text.trim());
                const hasAnswer = keys.includes(rawQ.correctAnswer);

                return {
                    id: 'q_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    content: rawQ.content,
                    options,
                    correctAnswer: hasAnswer ? rawQ.correctAnswer : '',
                    explanation: rawQ.explanation || '',
                    referenceNote: rawQ.referenceNote || '',
                    cognitiveLevel: COGNITIVE_LEVELS.includes(defaultCognitive) ? defaultCognitive : 'Nhận biết',
                    topic: defaultTopic || 'Kiến thức bài học',
                    needsReview: !hasAnswer || hasMissingOption,
                    duplicateWarning: false
                };
            },

            flagDuplicateQuestions(questions) {
                const seen = new Map();
                return questions.map(q => {
                    const norm = (q.content || '').toLowerCase().replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/g, '');
                    if (norm.length > 10 && seen.has(norm)) {
                        q.duplicateWarning = true;
                        q.needsReview = true;
                    } else if (norm.length > 10) {
                        seen.set(norm, true);
                        q.duplicateWarning = false;
                    }
                    return q;
                });
            },

            async analyzeAndDraftWithAI() {
                const quiz = this.syncInputFieldsToQuiz();
                if (!quiz) return;
                const raw = (quiz.rawInput || '').trim();
                const targetCount = parseInt(document.getElementById('inputTargetCount')?.value, 10) || 5;
                const optionCount = quiz.optionCount || 4;
                const keys = ['A', 'B', 'C', 'D', 'E'].slice(0, optionCount);

                if (!raw) {
                    this.toast('Vui lòng nhập nội dung tài liệu trước khi gọi AI phân tích!', 'warning');
                    return;
                }

                this.state.aiProcessing = true;
                this.state.aiStatusMessage = 'Đang gửi tài liệu đến mô-đun AI để chuẩn hóa câu hỏi trắc nghiệm THPT...';
                this.renderView();

                const systemPrompt = `Bạn là chuyên gia khảo thí và biên soạn câu hỏi trắc nghiệm THPT Việt Nam.
Nhiệm vụ: Phân tích tài liệu do giáo viên cung cấp và tạo/chuẩn hóa bộ câu hỏi trắc nghiệm khách quan.
Quy tắc bắt buộc:
1. Chỉ căn cứ vào tài liệu giáo viên cung cấp. Nếu câu hỏi có sẵn trong tài liệu nhưng thiếu đáp án hoặc dữ liệu không đủ xác định đáp án chắc chắn, đặt needsReview = true.
2. Mỗi câu hỏi phải có đúng ${optionCount} phương án (${keys.join(', ')}).
3. Mức độ nhận thức phải thuộc 1 trong 4 mức: "Nhận biết", "Thông hiểu", "Vận dụng", "Vận dụng cao".
4. Trả về đúng định dạng JSON Array.`;

                const userPrompt = `Tài liệu đầu vào của giáo viên:
"""
${raw}
"""
Yêu cầu cấu hình:
- Số lượng câu hỏi mong muốn: ${targetCount} câu (Nếu tài liệu đã có sẵn các câu hỏi, hãy chuẩn hóa đầy đủ các câu đó).
- Số phương án mỗi câu: ${optionCount} (${keys.join(', ')}).
- Mức độ nhận thức ưu tiên: ${quiz.cognitiveTarget || 'Hỗn hợp'}.
- Phạm vi chủ đề: ${quiz.topicScope || 'Theo tài liệu'}.`;

                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    content: { type: "STRING" },
                                    options: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                key: { type: "STRING" },
                                                text: { type: "STRING" }
                                            },
                                            required: ["key", "text"]
                                        }
                                    },
                                    correctAnswer: { type: "STRING" },
                                    explanation: { type: "STRING" },
                                    referenceNote: { type: "STRING" },
                                    cognitiveLevel: { type: "STRING" },
                                    topic: { type: "STRING" },
                                    needsReview: { type: "BOOLEAN" }
                                },
                                required: ["content", "options", "correctAnswer", "explanation", "cognitiveLevel", "topic", "needsReview"]
                            }
                        }
                    }
                };

                try {
                    // QUAN TRỌNG: Giữ nguyên khai báo const apiKey = "" để môi trường Canvas tự động cấp phát khóa hợp lệ (tránh lỗi 403)
                    const apiKey = "";
                    const effectiveKey = (this.state.aiConfig.sessionApiKey || "").trim() || apiKey;
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveKey}`;
                    const endpoint = (this.state.aiConfig.customEndpoint || "").trim() || apiUrl;

                    const response = await this.fetchWithRetry(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }, 3);

                    if (!response.ok) {
                        let errDetail = `Mã lỗi HTTP ${response.status}`;
                        try {
                            const errJson = await response.json();
                            if (errJson?.error?.message) {
                                errDetail += `: ${errJson.error.message}`;
                            }
                        } catch (_) {}
                        throw new Error(errDetail);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error('Phản hồi từ AI không chứa dữ liệu văn bản hợp lệ.');

                    const cleanJsonText = text.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                    const parsedArray = JSON.parse(cleanJsonText);
                    if (!Array.isArray(parsedArray) || parsedArray.length === 0) {
                        throw new Error('AI không trích xuất được câu hỏi nào từ văn bản này.');
                    }

                    const normalized = parsedArray.map((item, idx) => {
                        const mappedOptions = keys.map((k, kIdx) => {
                            const found = (item.options || []).find(o => (o.key || '').toUpperCase() === k) || item.options?.[kIdx];
                            return { key: k, text: found?.text || '' };
                        });
                        const validAns = keys.includes((item.correctAnswer || '').toUpperCase())
                            ? item.correctAnswer.toUpperCase()
                            : '';

                        return {
                            id: 'q_ai_' + Date.now() + '_' + idx,
                            content: item.content || '',
                            options: mappedOptions,
                            correctAnswer: validAns,
                            explanation: item.explanation || '',
                            referenceNote: item.referenceNote || 'Đề xuất bởi AI từ tài liệu',
                            cognitiveLevel: COGNITIVE_LEVELS.includes(item.cognitiveLevel) ? item.cognitiveLevel : 'Thông hiểu',
                            topic: item.topic || quiz.topicScope || 'Kiến thức bài học',
                            needsReview: Boolean(item.needsReview) || !validAns || mappedOptions.some(o => !o.text.trim()),
                            duplicateWarning: false
                        };
                    });

                    quiz.questions = this.flagDuplicateQuestions(normalized);
                    quiz.status = 'PENDING_APPROVAL';
                    quiz.approvedAt = null;
                    this.state.aiProcessing = false;
                    this.saveToStorage();
                    this.updateAIStatusUI('connected');
                    this.toast(`AI đã tạo thành công bản dự thảo gồm ${quiz.questions.length} câu hỏi! Vui lòng kiểm duyệt.`, 'success');
                    this.navigate('review', quiz.id);

                } catch (err) {
                    console.warn('Chi tiết lỗi kết nối AI:', err);
                    this.state.aiProcessing = false;
                    this.updateAIStatusUI('offline');
                    this.renderView();
                    this.openAIFallbackModal(err.message);
                }
            },

            async fetchWithRetry(url, options, retries = 3) {
                let delay = 1000;
                for (let i = 0; i <= retries; i++) {
                    try {
                        const res = await fetch(url, options);
                        if ((res.status === 429 || res.status >= 500) && i < retries) {
                            await new Promise(r => setTimeout(r, delay));
                            delay *= 2;
                            continue;
                        }
                        return res;
                    } catch (e) {
                        if (i === retries) throw e;
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }
                }
            },

                                    </h3>
                                    <p class="text-xs ${isApproved ? 'text-emerald-800' : 'text-amber-800'} mt-0.5 leading-relaxed">
                                        ${isApproved
                                            ? `Đã duyệt lúc ${quiz.approvedAt ? new Date(quiz.approvedAt).toLocaleString('vi-VN') : 'vừa xong'}. Lưu ý: Nếu Thầy/Cô chỉnh sửa bất kỳ nội dung nào dưới đây, hệ thống sẽ yêu cầu xác nhận lại.`
                                            : 'Vui lòng rà soát nội dung câu hỏi, phương án, đáp án đúng và lời giải. Chỉ sau khi nhấn "Xác nhận bộ câu hỏi", bạn mới có thể chuyển sang bước Cấu hình & Bắt đầu kiểm tra.'}
                                    </p>
                                    <div class="flex flex-wrap items-center gap-3 mt-2 text-xs font-semibold">
                                        <span class="px-2.5 py-0.5 rounded bg-white/80 text-slate-800 border border-slate-200">Tổng: ${total} câu</span>
                                        ${missingAnswerCount > 0 ? `<span class="px-2.5 py-0.5 rounded bg-rose-100 text-rose-800 border border-rose-300"><i class="fa-solid fa-circle-exclamation mr-1"></i>${missingAnswerCount} câu thiếu đáp án đúng</span>` : ''}
                                        ${flaggedCount > 0 ? `<span class="px-2.5 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300"><i class="fa-solid fa-flag mr-1"></i>${flaggedCount} câu đánh dấu cần xem lại</span>` : ''}
                                        ${duplicateCount > 0 ? `<span class="px-2.5 py-0.5 rounded bg-purple-100 text-purple-900 border border-purple-300"><i class="fa-solid fa-clone mr-1"></i>${duplicateCount} câu nghi trùng lặp</span>` : ''}
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center gap-2 shrink-0">
                                <button onclick="app.confirmDiscardDraft('${quiz.id}')" class="px-3 py-2 rounded-xl bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 text-xs font-semibold">
                                    Hủy dự thảo
                                </button>
                                ${!isApproved ? `
                                    <button onclick="app.approveQuizSet('${quiz.id}')" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm flex items-center gap-2">
                                        <i class="fa-solid fa-circle-check"></i> Xác nhận bộ câu hỏi
                                    </button>
                                ` : `
                                    <button onclick="app.navigate('config', '${quiz.id}')" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold shadow-sm flex items-center gap-2">
                                        <i class="fa-solid fa-sliders"></i> Tiếp tục: Chọn chế độ kiểm tra
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- Questions Editor List -->
                        ${total === 0 ? `
                            <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center space-y-3">
                                <i class="fa-solid fa-folder-open text-3xl text-slate-400"></i>
                                <p class="text-sm font-bold text-slate-700">Bộ câu hỏi này hiện chưa có câu hỏi nào</p>
                                <div class="flex items-center justify-center gap-2 pt-2">
                                    <button onclick="app.navigate('input', '${quiz.id}')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold">
                                        Nhập từ văn bản
                                    </button>
                                    <button onclick="app.addBlankQuestion()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold">
                                        + Thêm câu hỏi thủ công
                                    </button>
                                </div>
                            </div>
                        ` : `
                            <div class="space-y-4">
                                ${quiz.questions.map((q, qIdx) => this.renderSingleQuestionEditor(quiz, q, qIdx)).join('')}
                            </div>

                            <div class="pt-4 flex items-center justify-between">
                                <button onclick="app.addBlankQuestion()" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 text-xs font-bold flex items-center gap-2 shadow-2xs">
                                    <i class="fa-solid fa-plus text-blue-600"></i> Thêm câu hỏi mới vào cuối danh sách
                                </button>
                                <div class="flex items-center gap-2">
                                    <button onclick="app.saveDraft('${quiz.id}')" class="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold">
                                        Lưu bản dự thảo
                                    </button>
                                    <button onclick="app.approveQuizSet('${quiz.id}')" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm">
                                        <i class="fa-solid fa-circle-check mr-1"></i> Xác nhận bộ câu hỏi
                                    </button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            },

            renderSingleQuestionEditor(quiz, q, qIdx) {
                const missingAns = !q.correctAnswer;
                const borderClass = missingAns
                    ? 'border-rose-300 ring-1 ring-rose-200'
                    : q.needsReview
                        ? 'border-amber-300 ring-1 ring-amber-200'
                        : 'border-slate-200';

                return `
                    <div class="bg-white rounded-2xl border ${borderClass} shadow-2xs overflow-hidden">
                        <!-- Card Header -->
                        <div class="px-5 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2.5">
                                <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-extrabold">
                                    Câu ${qIdx + 1}
                                </span>
                                <span class="text-[11px] font-mono text-slate-400">#${this.escapeHTML(q.id.slice(-6))}</span>
                                ${missingAns ? `
                                    <span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-[11px] font-bold">
                                        <i class="fa-solid fa-triangle-exclamation mr-1"></i>Chưa chọn đáp án đúng
                                    </span>
                                ` : ''}
                                ${q.duplicateWarning ? `
                                    <span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800 text-[11px] font-bold">
                                        <i class="fa-solid fa-clone mr-1"></i>Nghi trùng lặp nội dung
                                    </span>
                                ` : ''}
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <!-- Cognitive Level Selector -->
                                <select onchange="app.updateQuestionField('${q.id}', 'cognitiveLevel', this.value)"
                                    class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700">
                                    ${COGNITIVE_LEVELS.map(lv => `<option value="${lv}" ${q.cognitiveLevel === lv ? 'selected' : ''}>Mức: ${lv}</option>`).join('')}
                                </select>

                                <!-- Flag Needs Review -->
                                <button onclick="app.toggleQuestionReviewFlag('${q.id}')"
                                    class="px-2.5 py-1 rounded-lg border text-xs font-semibold transition ${q.needsReview ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-100'}"
                                    title="Đánh dấu câu hỏi cần kiểm tra lại">
                                    <i class="fa-solid fa-flag mr-1"></i> ${q.needsReview ? 'Cần kiểm tra lại' : 'Đánh dấu xem lại'}
                                </button>

                                <!-- Order & Actions -->
                                <div class="flex items-center border border-slate-200 rounded-lg bg-white overflow-hidden">
                                    <button onclick="app.moveQuestion('${q.id}', -1)" class="px-2 py-1 text-slate-500 hover:bg-slate-100 text-xs" title="Lên trên">
                                        <i class="fa-solid fa-arrow-up"></i>
                                    </button>
                                    <button onclick="app.moveQuestion('${q.id}', 1)" class="px-2 py-1 text-slate-500 hover:bg-slate-100 text-xs border-l border-slate-200" title="Xuống dưới">
                                        <i class="fa-solid fa-arrow-down"></i>
                                    </button>
                                    <button onclick="app.duplicateQuestion('${q.id}')" class="px-2 py-1 text-slate-500 hover:bg-slate-100 text-xs border-l border-slate-200" title="Nhân bản câu hỏi">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                    <button onclick="app.deleteQuestion('${q.id}')" class="px-2 py-1 text-rose-500 hover:bg-rose-50 text-xs border-l border-slate-200" title="Xóa câu hỏi">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="p-5 space-y-4">
                            <!-- Question Content -->
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nội dung câu hỏi</label>
                                <textarea rows="2" oninput="app.updateQuestionField('${q.id}', 'content', this.value)"
                                    placeholder="Nhập nội dung câu hỏi trắc nghiệm..."
                                    class="w-full p-3 bg-slate-50 focus:bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-900 focus:outline-none focus:border-blue-600">${this.escapeHTML(q.content)}</textarea>
                            </div>

                            <!-- Options List + Radio for Correct Answer -->
                            <div>
                                <div class="flex items-center justify-between mb-1.5">
                                    <label class="text-[11px] font-bold text-slate-500 uppercase">
                                        Các phương án trả lời (Nhấn vào chữ cái A, B, C, D để chọn Đáp án đúng)
                                    </label>
                                    <div class="flex items-center gap-2 text-[11px]">
                                        <button onclick="app.addOptionToQuestion('${q.id}')" class="text-blue-600 hover:underline font-semibold">+ Thêm phương án</button>
                                        ${q.options.length > 2 ? `<button onclick="app.removeLastOptionFromQuestion('${q.id}')" class="text-slate-500 hover:text-rose-600">- Bớt phương án cuối</button>` : ''}
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                    ${q.options.map((opt, oIdx) => {
                                        const isCorrect = q.correctAnswer === opt.key;
                                        return `
                                            <div class="flex items-center gap-2 p-2 rounded-xl border ${isCorrect ? 'bg-emerald-50/70 border-emerald-400' : 'bg-white border-slate-200'}">
                                                <button type="button" onclick="app.setCorrectAnswer('${q.id}', '${opt.key}')"
                                                    class="w-8 h-8 rounded-lg font-extrabold text-xs shrink-0 flex items-center justify-center transition ${isCorrect ? 'bg-emerald-600 text-white shadow-2xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}"
                                                    title="Chọn ${opt.key} làm đáp án đúng">
                                                    ${opt.key}
                                                </button>
                                                <input type="text" value="${this.escapeHTML(opt.text)}"
                                                    oninput="app.updateOptionText('${q.id}', ${oIdx}, this.value)"
                                                    placeholder="Nhập nội dung phương án ${opt.key}..."
                                                    class="w-full bg-transparent text-xs font-medium text-slate-800 focus:outline-none">
                                                ${isCorrect ? `<i class="fa-solid fa-check text-emerald-600 text-xs px-1" title="Đáp án đúng"></i>` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- Explanation & Reference Note -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1">
                                <div class="md:col-span-2">
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Lời giải chi tiết & Giải thích phương án nhiễu</label>
                                    <textarea rows="2" oninput="app.updateQuestionField('${q.id}', 'explanation', this.value)"
                                        placeholder="Nhập lời giải hoặc căn cứ giải thích vì sao đáp án này đúng..."
                                        class="w-full p-2.5 bg-slate-50 focus:bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:border-blue-600">${this.escapeHTML(q.explanation || '')}</textarea>
                                </div>
                                <div class="space-y-2">
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Chủ đề kiến thức</label>
                                        <input type="text" value="${this.escapeHTML(q.topic || '')}"
                                            oninput="app.updateQuestionField('${q.id}', 'topic', this.value)"
                                            placeholder="VD: Chu kì dao động"
                                            class="w-full px-2.5 py-1.5 bg-slate-50 focus:bg-white border border-slate-200 rounded-lg text-xs text-slate-700">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Căn cứ / Ghi chú tham chiếu</label>
                                        <input type="text" value="${this.escapeHTML(q.referenceNote || '')}"
                                            oninput="app.updateQuestionField('${q.id}', 'referenceNote', this.value)"
                                            placeholder="VD: SGK trang 12..."
                                            class="w-full px-2.5 py-1.5 bg-slate-50 focus:bg-white border border-slate-200 rounded-lg text-xs text-slate-700">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            updateQuestionField(qId, field, value) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q) return;
                q[field] = value;
                this.markQuizModified(quiz);
            },

            updateOptionText(qId, optIdx, value) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q || !q.options[optIdx]) return;
                q.options[optIdx].text = value;
                this.markQuizModified(quiz);
            },

            setCorrectAnswer(qId, key) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q) return;
                q.correctAnswer = key;
                this.markQuizModified(quiz);
                this.renderView();
            },

            toggleQuestionReviewFlag(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q) return;
                q.needsReview = !q.needsReview;
                this.saveToStorage();
                this.renderView();
            },

            addOptionToQuestion(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q || q.options.length >= 6) return;
                const nextKey = String.fromCharCode(65 + q.options.length);
                q.options.push({ key: nextKey, text: '' });
                this.markQuizModified(quiz);
                this.renderView();
            },

            removeLastOptionFromQuestion(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const q = quiz.questions.find(item => item.id === qId);
                if (!q || q.options.length <= 2) return;
                const removed = q.options.pop();
                if (q.correctAnswer === removed.key) q.correctAnswer = 'A';
                this.markQuizModified(quiz);
                this.renderView();
            },

            addBlankQuestion() {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                quiz.questions.push(this.createEmptyQuestion(quiz.optionCount || 4, quiz.cognitiveTarget, quiz.topicScope));
                this.markQuizModified(quiz);
                this.renderView();
                this.toast('Đã thêm câu hỏi mới vào danh sách.', 'info');
            },

            duplicateQuestion(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const idx = quiz.questions.findIndex(item => item.id === qId);
                if (idx === -1) return;
                const clone = JSON.parse(JSON.stringify(quiz.questions[idx]));
                clone.id = 'q_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
                clone.content = clone.content + ' (Bản sao)';
                quiz.questions.splice(idx + 1, 0, clone);
                this.markQuizModified(quiz);
                this.renderView();
            },

            moveQuestion(qId, direction) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                const idx = quiz.questions.findIndex(item => item.id === qId);
                const targetIdx = idx + direction;
                if (idx === -1 || targetIdx < 0 || targetIdx >= quiz.questions.length) return;
                const temp = quiz.questions[idx];
                quiz.questions[idx] = quiz.questions[targetIdx];
                quiz.questions[targetIdx] = temp;
                this.markQuizModified(quiz);
                this.renderView();
            },

            deleteQuestion(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                this.showModal({
                    title: 'Xác nhận xóa câu hỏi',
                    body: `<p class="text-xs text-slate-600">Thầy/Cô có chắc chắn muốn xóa câu hỏi này khỏi bản dự thảo không?</p>`,
                    footer: `
                        <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Hủy</button>
                        <button onclick="app.executeDeleteQuestion('${qId}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Xóa câu hỏi</button>
                    `
                });
            },

            executeDeleteQuestion(qId) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return;
                quiz.questions = quiz.questions.filter(q => q.id !== qId);
                this.markQuizModified(quiz);
                this.closeModal();
                this.renderView();
                this.toast('Đã xóa câu hỏi.', 'info');
            },

            saveDraft(quizId) {
                const quiz = this.getQuiz(quizId);
                if (!quiz) return;
                if (quiz.status === 'EMPTY' && quiz.questions.length > 0) {
                    quiz.status = 'DRAFTING';
                }
                quiz.updatedAt = new Date().toISOString();
                this.saveToStorage();
                this.renderSidebar();
                this.renderHeaderBar();
                this.toast('Đã lưu bản dự thảo thành công.', 'success');
            },

            confirmDiscardDraft(quizId) {
                this.showModal({
                    title: 'Hủy toàn bộ câu hỏi dự thảo?',
                    body: `<p class="text-xs text-slate-600">Thao tác này sẽ xóa danh sách câu hỏi đang biên tập trong bộ câu hỏi hiện tại và đưa trạng thái về "Chưa có câu hỏi". Văn bản gốc ở mục Nhập liệu vẫn được giữ lại.</p>`,
                    footer: `
                        <button onclick="app.closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Không</button>
                        <button onclick="app.executeDiscardDraft('${quizId}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Xác nhận hủy dự thảo</button>
                    `
                });
            },

            executeDiscardDraft(quizId) {
                const quiz = this.getQuiz(quizId);
                if (!quiz) return;
                quiz.questions = [];
                quiz.status = 'EMPTY';
                quiz.approvedAt = null;
                this.saveToStorage();
                this.closeModal();
                this.navigate('input', quiz.id);
                this.toast('Đã hủy bản dự thảo.', 'info');
            },

            approveQuizSet(quizId) {
                const quiz = this.getQuiz(quizId);
                if (!quiz) return;

                if (quiz.questions.length === 0) {
                    this.toast('Không thể xác nhận bộ câu hỏi rỗng! Vui lòng thêm ít nhất 1 câu hỏi.', 'error');
                    return;
                }

                // Kiểm tra các câu thiếu nội dung hoặc thiếu phương án
                const emptyContentIdx = quiz.questions.findIndex(q => !q.content || !q.content.trim());
                if (emptyContentIdx !== -1) {
                    this.toast(`Câu số ${emptyContentIdx + 1} chưa có nội dung câu hỏi. Vui lòng bổ sung!`, 'error');
                    return;
                }

                const emptyOptIdx = quiz.questions.findIndex(q => q.options.some(o => !o.text || !o.text.trim()));
                const missingAnsIdx = quiz.questions.findIndex(q => !q.correctAnswer);

                if (emptyOptIdx !== -1 || missingAnsIdx !== -1) {
                    this.showModal({
                        title: 'Cảnh báo câu hỏi chưa đầy đủ phương án / đáp án',
                        body: `
                            <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs space-y-1">
                                ${emptyOptIdx !== -1 ? `<p>• <strong>Câu ${emptyOptIdx + 1}</strong> có phương án trả lời đang để trống.</p>` : ''}
                                ${missingAnsIdx !== -1 ? `<p>• <strong>Câu ${missingAnsIdx + 1}</strong> chưa được chọn đáp án đúng.</p>` : ''}
                            </div>
                            <p class="text-xs text-slate-600 mt-2">
                                Để bảo đảm tính chính xác khi chấm điểm và trình chiếu đáp án, Thầy/Cô nên bổ sung đầy đủ trước khi xác nhận. Thầy/Cô muốn quay lại bổ sung hay vẫn xác nhận?
                            </p>
                        `,
                        footer: `
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Quay lại bổ sung</button>
                            <button onclick="app.forceApproveQuizSet('${quiz.id}')" class="px-3.5 py-2 rounded-xl bg-slate-200 text-slate-700 text-xs font-semibold">Vẫn xác nhận (Chỉ dùng trình chiếu thảo luận)</button>
                        `
                    });
                    return;
                }

                this.forceApproveQuizSet(quiz.id);
            },

            forceApproveQuizSet(quizId) {
                const quiz = this.getQuiz(quizId);
                if (!quiz) return;
                quiz.questions.forEach(q => { q.needsReview = false; });
                quiz.status = 'APPROVED';
                quiz.approvedAt = new Date().toISOString();
                quiz.updatedAt = new Date().toISOString();
                this.saveToStorage();
                this.closeModal();
                this.renderSidebar();
                this.renderView();
                this.toast('Đã XÁC NHẬN bộ câu hỏi! Bây giờ Thầy/Cô có thể nhấn "Cấu hình & Tổ chức kiểm tra".', 'success');
            },

            renderConfigView(ws) {
                const quiz = this.getQuiz(this.state.selectedQuizId);
                if (!quiz) return this.navigate('dashboard');

                                            <p class="text-xs text-slate-600 mt-1 leading-relaxed">
                                                Học sinh tự chọn và thay đổi phương án trả lời trên thiết bị hiện tại, nộp bài để chấm điểm tự động, xem thống kê đúng/sai và lời giải chi tiết.

                            <!-- Detailed Parameters -->

                                        <option value="20" selected>20 giây (Khuyên dùng trên lớp)</option>

                                        <input id="cfgAutoAdvanceOnTimeout" type="checkbox" class="rounded text-blue-600">

                                    </label>

                                        <strong>Thông báo kỹ thuật trung thực:</strong> Tệp HTML hiện đang chạy độc lập trên trình duyệt cục bộ. Chế độ này phục vụ <em>Tự luyện trên thiết bị hiện tại</em> (lưu kết quả cục bộ). Nếu cần tổ chức cho nhiều học sinh làm bài đồng thời từ các thiết bị riêng và thu bài về máy giáo viên, hệ thống cần kết nối thêm máy chủ đồng bộ.
